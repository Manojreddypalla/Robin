<html><body><h1>Todo List</h1><ul id='todoItems'></ul><input type='text' id='newItem'><button onclick='addTodo()'>Add Todo</button><script>function addTodo(){let item = document.getElementById('newItem').value;if(item){let list = document.getElementById('todoItems');let li = document.createElement('li');li.textContent = item;list.appendChild(li);document.getElementById('newItem').value = '';}}</script></body></html>
